<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RK3588 Eye Display Test</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #101010;
      }

      .screen {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .panel {
        display: grid;
        place-items: center;
        color: #fff;
        font-size: min(16vw, 180px);
        font-weight: 700;
        letter-spacing: 0;
      }

      .left {
        background: #d92626;
      }

      .right {
        background: #159447;
      }
    </style>
  </head>
  <body>
    <main class="screen" aria-label="左右眼显示测试">
      <section class="panel left">LEFT</section>
      <section class="panel right">RIGHT</section>
    </main>
  </body>
</html>
